[workspace]
members = [
  "crates/cutokyo-domain",
  "crates/cutokyo-core",
  "crates/cutokyo-cli",
  "crates/cutokyo-desktop",
  "tools/fake-harness",
  "tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/lucasbabur/cutokyo"
authors = ["Cutokyo contributors"]

[workspace.dependencies]
cutokyo-domain = { path = "crates/cutokyo-domain", version = "0.1.0" }
cutokyo-core = { path = "crates/cutokyo-core", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde"] }
uuid = { version = "=1.26.1", features = ["serde"] }
tempfile = "=3.27.0"
jsonschema = { version = "=0.56.0", default-features = false }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
rusqlite_migration = "=2.6.0"
fs4 = "=1.1.0"
sha2 = "=0.11.0"
clap = { version = "=4.5.48", features = ["derive", "env"] }
directories = "=6.0.0"
toml = "=0.9.7"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
tar = "=0.4.44"
flate2 = "=1.1.2"
keyring = "=4.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "npm"]
npm-package = "cutokyo"
npm-shrinkwrap = true
pr-run-mode = "plan"
# The release workflow layers pinned actions, signing preflight, Tauri, SBOM, and
# provenance jobs over cargo-dist's plan. It is intentionally maintained here.
allow-dirty = ["ci"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"
