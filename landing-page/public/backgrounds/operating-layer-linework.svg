    </g>
    <g class="shape bar-left">
      <path d="M-83 478L71 433L166 718L9 767Z" />
      <path d="M-50 482L50 452L139 709" opacity=".45" />
    </g>
    <g class="shape triangle-bottom">
      <path d="M-15 899L184 729L244 974Z" />
      <path d="M25 894L180 758L227 952" opacity=".45" />
    </g>
    <g class="shape round-bottom">
      <path d="M1040 1071C1014 921 1114 806 1254 812C1393 818 1488 925 1472 1064" />
      <path d="M1071 1065C1048 944 1129 844 1249 845C1371 848 1453 943 1439 1054" opacity=".55" />
    </g>
    <g class="shape round-right">
      <path
        d="M1519 543C1419 535 1371 610 1380 688C1389 766 1458 810 1536 796C1604 784 1642 725 1627 658"
      />
    </g>
    <g class="shape square-bottom">
      <path d="M450 909L564 880L594 994L480 1023Z" />
    </g>
  </g>
  <g class="shape details" stroke="#889a8a" stroke-width="1.2" stroke-linecap="round" opacity=".65">
    <path d="M370 100H390M380 90V110M1062 409H1082M1072 399V419M883 902H903M893 892V912" />
    <circle cx="962" cy="82" r="5" />
    <circle cx="54" cy="395" r="4" />
    <circle cx="1537" cy="463" r="6" />
    <path d="M661 49L699 60M667 36L705 47M674 24L712 35" opacity=".55" />
  </g>
</svg>
