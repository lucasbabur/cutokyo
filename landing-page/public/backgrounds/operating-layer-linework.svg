<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <style>
    .shape {
      transform-box: view-box;
      animation: float 6s ease-in-out infinite alternate;
    }
    .round-left {
      transform-origin: 125px 190px;
      animation-duration: 5.4s;
      animation-delay: -7s;
    }
    .square-top {
      transform-origin: 1280px 200px;
      animation-name: turn;
      animation-duration: 7.2s;
      animation-delay: -13s;
    }
    .triangle-top {
      transform-origin: 1530px 310px;
      animation-duration: 6.6s;
      animation-delay: -18s;
    }
    .bar-left {
      transform-origin: 50px 600px;
      animation-name: turn;
      animation-duration: 8.4s;
      animation-delay: -11s;
    }
    .triangle-bottom {
      transform-origin: 140px 870px;
      animation-duration: 6s;
      animation-delay: -16s;
    }
    .round-bottom {
      transform-origin: 1250px 1000px;
      animation-duration: 7.8s;
      animation-delay: -24s;
    }
    .round-right {
      transform-origin: 1500px 675px;
      animation-name: turn;
      animation-duration: 6.6s;
      animation-delay: -4s;
    }
    .square-bottom {
      transform-origin: 520px 950px;
      animation-name: turn;
      animation-duration: 7.2s;
      animation-delay: -20s;
    }
    .details {
      animation-name: drift;
      animation-duration: 9s;
      animation-delay: -10s;
    }
    @keyframes float {
      from {
        transform: translate(-18px, 20px) rotate(-4deg);
      }
      to {
        transform: translate(22px, -26px) rotate(4deg);
      }
    }
    @keyframes turn {
      from {
        transform: translate(15px, -18px) rotate(-5deg);
      }
      to {
        transform: translate(-20px, 24px) rotate(5deg);
      }
    }
    @keyframes drift {
      from {
        transform: translate(-10px, 12px);
      }
      to {
        transform: translate(12px, -14px);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .shape {
        animation: none;
      }
    }
  </style>
  <g stroke="#889a8a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
