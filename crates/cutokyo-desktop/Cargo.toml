[package]
name = "cutokyo-desktop"
description = "Tauri desktop frontend for Cutokyo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["desktop-runtime", "custom-protocol"]
desktop-runtime = ["dep:tauri", "tauri/wry"]
custom-protocol = ["tauri/custom-protocol"]
native-e2e = [
  "desktop-runtime",
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
]

[dependencies]
cutokyo-core.workspace = true
cutokyo-domain.workspace = true
fs4.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid = { workspace = true, features = ["v4"] }
tauri = { version = "=2.11.5", default-features = false, optional = true, features = [] }
tauri-plugin-wdio = { version = "=1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[lints]
workspace = true
