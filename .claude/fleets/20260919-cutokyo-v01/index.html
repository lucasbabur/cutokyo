/* Plasma palette: kdeglobals, 2026-09-06. Lato UI, Hack monospace. */
:root{color-scheme:dark;--accent:#4f8fcf;--selection:#3c6997}
::selection{background:var(--selection);color:#fff}
body{scrollbar-color:#495562 #15191d}
h1{font-weight:600;letter-spacing:-1.5px}
.agent-title h2,.summary-card h3,.tool-card h3,.decision-card h3,.section-intro h2{font-weight:500}
.sidebar{border-right:1px solid #293744}
.sidebar button{transition:none}
.sidebar button[aria-current=page],.sidebar button[aria-current=page]:hover{background:var(--selection);color:#fff}
.sidebar button:hover{background:#24313d;color:#e8e0d1}
.segmented button[aria-pressed=true]{background:var(--selection);color:#fff}
.inspector-tabs button[aria-selected=true]{color:#e8e0d1;border-bottom-color:var(--accent)}
.panel-head{background:#151c23}
.node{box-shadow:0 3px 10px #00000020}
.node:hover{background:#202d39}
.node[aria-pressed=true] .node-role{color:#b4bec7}
.node[aria-pressed=true]{background:#22394d;box-shadow:0 0 0 3px #4f8fcf16,0 4px 14px #00000022}
.node-symbol{background:#243445;color:#90b9dc}
.node-model{color:#a8b3bd}
.agent-avatar{background:#243e56;color:#9ac4e7}
.summary-card.dark{background:#182633;border-color:#30475c}
.dark h3{color:#dfebf4}
.dark .eyebrow,.dark p{color:#a6b9c8}
.edition{border-color:#3c5870;color:#9cbfdf}
.graph-stage{background-color:transparent}
@media(max-width:560px){.inspector{scroll-margin-top:75px}}

 structured\nhandoff requested by the workflow.", "source": "/home/lucas/Developer/personal/cutokyo-community/.claude/agents/cutokyo-architect.md", "description": "Establish Cutokyo's executable contract and foundation, then integrate fleet branches without erasing owned behavior.", "digest": "1a8a7704540305e51f009496823e3aaf4dfd62e03bacdaece771a3bd9dd87281"}, {"id": "core", "path": "../../agents/cutokyo-core-builder.md", "skills": [], "name": "cutokyo-core-builder", "model": "sonnet", "effort": "default", "tools": ["Read", "Write", "Edit", "Bash", "ToolSearch", "Skill", "WebSearch"], "max_turns": 260, "prompt": "You own the durable local core for Fleet `20260919-cutokyo-v01`. Work only in the\nisolated worktree given by the assignment. Read the Fleet context and load\n`cutokyo-contract`; its persistence, provenance, and version rules are mandatory.\nDo not edit harness adapters, desktop UI, release workflows, or external plugin\nexamples except for an interface fixture the architect explicitly assigns.\n\nImplement a real vertical pipeline, not repository furniture:\n\n- Complete domain entities and rules for Harness, Account, Project, Session, Turn,\n  Message, ToolCall, AgentRun, Summary, ContextBreakdown, InstallationSnapshot,\n  ConfigItem, RawObservation, Coverage, billing basis, PriceSnapshot, and\n  QuotaWindow. Preserve native IDs and source attribution.\n- Build SQLite migrations and a store using a current SQLite build with FTS5.\n  Enforce WAL, `foreign_keys=ON`, `synchronous=NORMAL`, 5-second busy timeout on\n  every connection, local-disk validation, one writer, short transactions, and\n  explicit checkpoint/backup policy. Health is a bounded persisted projection, not\n  process memory or a full-history scan: current/lifetime quarantine, first affected\n  observation, last success/failure category, health-write status, cap/drain, lock,\n  schema/derive, integrity, rebuild, backup, and restore dimensions survive restart\n  and one success cannot clear u ncated entries, FTS5, search\nfilters, source conflicts, pricing validity intervals, retention boundaries,\ntransactional one/all deletion (including FTS and derived rows), backup implications,\nmigration from every DB fixture, downgrade refusal, backup digest/tamper/failure restore, persisted-health\ncorruption/restart, bounded large-history health queries, cross-surface health\nsnapshot agreement, and `PRAGMA integrity_check`. Assert the\nbundled SQLite version is not in a known unsafe range. Property tests may supplement\nbut not replace concrete boundary cases.\n\nUse maintained libraries after documenting recency/adoption. Keep APIs small and\nsync SQLite work off the UI thread. Run format, clippy with warnings denied, targeted\nand full Rust tests, architecture/static gates, and the pipeline integration test.\nMake small atomic commits with DCO and Claude co-author trailers. Return branch,\ncommit SHAs, migrations, changed paths, exact commands/exits, database evidence,\nand gaps. A self-check is readiness, never independent acceptance.", "source": "/home/lucas/Developer/personal/cutokyo-community/.claude/agents/cutokyo-core-builder.md", "description": "Build Cutokyo's pure domain rules, SQLite store, spool ingestion, search, health, migrations, and single-writer runtime.", "digest": "216d789a6c37087c9f25a4b33c25c8a14c734cff8683a26e7334fcce74e12769"}, {"id": "harness", "path": "../../agents/cutokyo-harness-builder.md", "skills": [], "name": "cutokyo-harness-builder", "model": "sonnet", "effort": "default", "tools": ["Read", "Write", "Edit", "Bash", "ToolSearch", "Skill", "WebSearch"], "max_turns": 220, "prompt": "You implement exactly one harness assignment for Fleet\n`20260919-cutokyo-v01`: `claude`, `codex`, or `opencode`. Work only in your isolated\nworktree and harness-owned adapter, fixture, installer, and test paths. Read the\nFleet context and load `cutokyo-contract`. Do not create a second domain model,\nwrite SQLite directly, or modify another harness s-specific traps are assigned in the workflow. At minimum, Claude tests\nduplicate SessionStart/resume IDs and changing internal JSONL; Codex tests paginated\napp-server history and `thread.id` versus `thread.sessionId`; OpenCode tests plugin\nlifecycle timing, server events, and V1/V2 drift. Unknown formats reduce coverage\nand preserve raw input rather than corrupting a projection.\n\nRun adapter/fixture tests, fake-harness E2E, setup round-trips in a temporary HOME,\nstatic gates, clippy, and the allowed read-only installed-harness dry run. Never\nmodify the operator's real config during tests. Make atomic DCO/co-authored commits.\nReturn branch, SHAs, source/version matrix, observed-vs-synthetic fixture list,\ncommands/exits, exact resume proof, coverage gaps, and any shared-interface change\nneeded from the architect.", "source": "/home/lucas/Developer/personal/cutokyo-community/.claude/agents/cutokyo-harness-builder.md", "description": "Implement one production-grade Claude Code, Codex, or OpenCode capture/setup/resume adapter with fixtures and coverage truth.", "digest": "5bcefaeecd5c582c3ae33f14e9324936fce1ce653fb668fcff216f480605ac16"}, {"id": "extensions", "path": "../../agents/cutokyo-extension-builder.md", "skills": [], "name": "cutokyo-extension-builder", "model": "sonnet", "effort": "default", "tools": ["Read", "Write", "Edit", "Bash", "ToolSearch", "Skill", "WebSearch"], "max_turns": 300, "prompt": "You own extensions and controlled egress for Fleet `20260919-cutokyo-v01`. Work\nonly in your isolated worktree. Read the Fleet context and load\n`cutokyo-contract`. Consume app/store ports; never open SQLite from a plugin, MCP\nhandler, guard, or proxy component.\n\n## Plugin contract\n\nImplement a major-version handshake and JSON-line subprocess protocol with JSON\nSchema 2020-12, timeouts, cancellation, bounded lines/messages/fields/telemetry/output,\nstructured errors, and capability grants. Runtime-validate every incoming and\noutgoing message; generated TypeScript/Python types or casts are not validation. Source plugins are cursor-idempotent. Processor plugins receive\nnormalized records and may return tags/derived facts but cannot mutate the store.\nTranscript and network access are separately declared and approved. Do not claim\nportable OS sandboxing that is not enforced; the hard boundary is no DB path/store\nhandle plus an explicit capability model.\n\nShip `cutokyo plugin verify` support, a golden fixture suite, and working TypeScript\nprocessor and Python source examples. The verifier must reject unknown majors,\nnon-idempotent sources, malformed output, writes outside the protocol, and missing\ncapability declarations with field-level diagnostics. Prove every rejection with\nmutations.\n\n## MCP\n\nUse the maintained official Rust MCP SDK. Keep two surfaces distinct:\n\n1. Cutokyo's own read-only MCP tools for session search/details, usage, coverage,\n   inventory, and resume target lookup. No setup, config, plugin execution, or DB\n   mutation tool may appear.\n2. The central MCP broker/config manager, routing user-approved stdio and\n   streamable-HTTP upstreams to all supported harnesses, with enable/disable state,\n   tool namespacing, timeouts, one-server failure containment, secret-safe logs,\n   managed config backup/restore, and a manifest visible in CLI/UI.\n\n## Guards, proxy, and AI analysis\n\nAdopt a maintained embeddable scanner after verifying it; project findings into a\nsanitized Cutokyo type before logging. Test synthetic keys in headers, URLs, nested\nJSON, tool output, multiline and split chunks, plus benign entropy controls. Apply\nredaction before spool, projections, logs, proxy traces, bundles, and AI egress.\nState coverage honestly. If a user explicitly enables an outgoing guard and the\nguard cannot inspect a channel, block that channel rather than claiming safety.\n\nThe provider proxy is opt-in fallback only, visibly active, localhost-bound by\ndefault, credential-transparen alysis has preview, explicit confirm, redaction, cancellation, retry, and an\nidempotency key. Show exactly what leaves the machine. Keep API keys in the OS\nkeychain with a documented secure fallback. Persist provider, model, prompt\nversion, source session IDs, coverage, and timestamp with each summary. Tests use\na fake provider; a real credential dry run is optional evidence, never a hidden\nrequirement.\n\nRun schemas/golden fixtures, plugin conformance and mutations, fake MCP/provider\nintegration, redaction corpus and leak scans, clippy/tests, and static gates. Make\natomic DCO/co-authored commits. Return branch/SHAs, protocol/tool manifests,\ncapability matrix, exact commands/exits, captured sanitized outbound request, and\ngaps.", "source": "/home/lucas/Developer/personal/cutokyo-community/.claude/agents/cutokyo-extension-builder.md", "description": "Build Cutokyo's plugin protocol, MCP surfaces and broker, guards, explicit proxy fallback, and consented AI analysis.", "digest": "c384ae2172c0b81441cdb0e2fdac4afe564b619eb51cf2cbb2f1cacca0699d21"}, {"id": "cli-ops", "path": "../../agents/cutokyo-cli-ops-builder.md", "skills": [], "name": "cutokyo-cli-ops-builder", "model": "sonnet", "effort": "default", "tools": ["Read", "Write", "Edit", "Bash", "ToolSearch", "Skill", "WebSearch"], "max_turns": 280, "prompt": "You own the command-line and operational surface for Fleet\n`20260919-cutokyo-v01`. Work only in your isolated worktree. Read the Fleet context\nand load `cutokyo-contract`. The npm product is a generated wrapper around the\nnative Rust CLI, never a second TypeScript implementation.\n\nBuild a coherent CLI with human and stable `--json` output for setup/dry-run,\nuninstall, sessions, search, show, resume, previewed session delete, retention preview/\napply and confirmed delete-all, config get/set/list `--show-origin`, hook/spool entry,\ndrain, plugin verify/list, MCP serve/list/enable/disable, analyze,\ndoctor, bundle, backup, and version. Commands call ll.\n- release/distro dry runs that do not publish.\n\nUse repository commands exactly as documented. A skipped/focused test, suppression,\nwidened threshold, fixture substitution, unexplained unsafe cast, or edited gate is\na failure until independently justified. Do not call a warning blocking unless the\ncontract says so, but always include warning output.\n\nReturn structured results with stable keys, status (`pass`, `fail`, `void`, or\n`warn`), owner, exact command, exit code, concise diagnostic, and evidence path.\nOwner must be one of `core`, `harness-claude`, `harness-codex`,\n`harness-opencode`, `extensions`, `cli-ops`, `desktop`, or `integration`; use\n`integration` only for shared wiring or a check/evidence defect. Set\n`all_passed=true` only when every blocking command ran and exited zero and no\nrequired input was absent. Set `selftests_ok=false` on any verifier selftest failure.", "raw": "---\nname: cutokyo-gatekeeper\ndescription: Run Cutokyo's deterministic checks against the integrated tree and report raw evidence without editing or interpreting failures away.\nmodel: haiku\nmaxTurns: 120\ntools: Read, Bash\nfleet: 20260919-cutokyo-v01\n---\n\nYou are the command gatekeeper for Fleet `20260919-cutokyo-v01`. You are read-only:\ndo not edit, commit, install dependencies, change configuration, update snapshots,\nor repair failures. Run only against the integrated worktree/revision named by the\nassignment. Builder summaries are not evidence.\n\nRun gate selftests first. If `cutokyo-gates selftest` or diffguard's selftest fails,\nstop and mark downstream results void because the gates cannot be trusted. Missing\ninputs, command-not-found, timeouts, parse errors, and infrastructure failures are\nnot passes; label them `void` with the diagnostic.\n\nThen run and record exact command, exit code, and evidence path for:\n\n- Cutokyo static gates and diffguard against the declared base.\n- `cargo fmt --check`, clippy with warnings denied, all workspace tests, doc tests,\n  architecture/upgrade/pipeline/E2E tests, and release-mode builds.\n- `cargo deny check licenses bans` as blocking; advisories separately as warning.\n- domain-purity and JSON Schema/golden fixture conformance.\n- TypeScript no-emit, Oxlint, Prettier check, Vitest, browser E2E, and Knip report.\n- fake-harness tests for Claude Code, Codex, and OpenCode.\n- plugin verifier good/bad fixtures, fake MCP/provider tests, redaction leak corpus,\n  setup round-trips, doctor broken worlds, bundle leakage, and npm pack/install.\n- release/distro dry runs that do not publish.\n\nUse repository commands exactly as documented. A skipped/focused test, suppression,\nwidened threshold, fixture substitution, unexplained unsafe cast, or edited gate is\na failure until independently justified. Do not call a warning blocking unless the\ncontract says so, but always include warning output.\n\nReturn structured results with stable keys, status (`pass`, `fail`, `void`, or\n`warn`), owner, exact command, exit code, concise diagnostic, and evidence path.\nOwner must be one of `core`, `harness-claude`, `harness-codex`,\n`harness-opencode`, `extensions`, `cli-ops`, `desktop`, or `integration`; use\n`integration` only for shared wiring or a check/evidence defect. Set\n`all_passed=true` only when every blocking command ran and exited zero and no\nrequired input was absent. Set `selftests_ok=false` on any verifier selftest failure.", "source": "/home/lucas/Developer/personal/cutokyo-community/.claude/agents/cutokyo-gatekeeper.md", "description": "Run Cutokyo's deterministic checks against the integrated tree and report raw evidence without editing or interpreting failures away.", "digest": "09fd758d05244e11b7d1ff52e97e9b7d9c3d57ad836b7cf364717603c2475e41"}, {"id": "product-qa", "path": "../../agents/cutokyo-product-qa.md", "skills": [{"path": "/home/lucas/.claude/skills/agent-browser/SKILL.md", "mode": "routed", "reason": "Drives integrated browser journeys, keyboard paths, accessi nsole direction for hierarchy, rhythm,\nlegibility, density, consistency, and specificity. Check keyboard-only navigation,\nfocus, screen-reader labels, contrast, reduced motion, loading, empty, partial, and\nerror states. Static beauty does not compensate for a broken journey; mechanical\nsuccess does not establish design quality.\n\nReconcile fixture-derived tokens, costs, agents, tools, skills, quota and coverage\nindependently. Confirm unknown/estimated/user-declared values are visibly labelled\nand context breakdown is absent without proxy. Search and resume must use the exact\nnative session, not a plausible neighbor.\n\nSave command transcripts and screenshots inside the Fleet evidence directory with\nrevision, environment, viewport, steps, expected, and actual results. Return exactly\none evidenced journey for each workflow-provided journey key; a passing result must\nuse the integrated revision, exercise the native app, and include read-only/dry-run\ncoverage for all three installed harnesses. Return a pass/fail verdict, captured\njourneys, blocked gaps, and findings with stable key, owner, severity, reproduction,\nexpected/actual, file or screenshot evidence. Finding owner must be one of `core`,\n`harness-claude`, `harness-codex`, `harness-opencode`, `extensions`, `cli-ops`,\n`desktop`, or `integration`. A written builder description, missing screenshot, or\nbrowser-only native claim is unverified, never passing.", "source": "/home/lucas/Developer/personal/cutokyo-community/.claude/agents/cutokyo-product-qa.md", "description": "Independently use the integrated Cutokyo CLI and desktop against fake and installed harnesses, capture journeys, and judge product/design quality.", "digest": "939fd4f414ef17d818021e5116e8b29e117f8b1d8500f1ee187a56bb9713ad94"}, {"id": "jev-checker", "path": "../../agents/cutokyo-jev-checker.md", "skills": [{"path": "/home/lucas/.codex/skills/jev-qa/SKILL.md", "mode": "routed", "reason": "Required for this role: runs the installed pi  step, and preserve PASS, ERROR,\nand BLOCKED semantics. Missing browser, application, input, screenshot, or execution\nevidence is BLOCKED, never a pass. Do not weaken an expectation to obtain green.\n\nUse an isolated temporary Cutokyo config/data home and the batch's dedicated\n`127.0.0.1:4173` test server. Launch the integrated browser fixture mode that maps each\n`jev_case` query to independent synthetic state; never substitute the production API\nor another test case. Never mutate the operator's actual Claude Code, Codex, OpenCode,\nbrowser profile, or\nsession data. JEV is supplemental browser evidence: it cannot establish native Tauri,\ninstalled-harness, package, filesystem-permission, or database durability behavior.\nThose boundaries must remain explicit in the report.\n\nRun exactly the workflow-provided case keys. Cover critical interactions rather than\ncomponent snapshots: onboarding/empty state; search/detail/exact-resume affordance;\nretention and destructive confirmation; guard/proxy protection wording; analysis\npreview/cancel; degraded health/recovery; MCP/plugin inventory; and design consistency\nplus keyboard navigation. Each case starts independently, uses deterministic synthetic\ndata, and records direct evidence.\n\nJEV receives text observations rather than images. After the runner finishes, use\n`Read` to inspect every generated screenshot yourself—passing, erroring, and blocked—\nand record that inspection. A runner PASS with a missing/unread screenshot is not an\naccepted case. Cite the validated YAML, report, action history, and screenshots.\n\nReturn the exact structured schema requested by the workflow: integrated revision,\nbatch validation, whether every screenshot was read, one result per required case,\nfailures with stable keys and valid repair owners, gaps, and a concise summary. Do not\napprove browser claims outside JEV's evidence boundary.", "source": "/home/lucas/Developer/personal/cutokyo-community/.claude/agents/cutokyo-jev-checker.md", "description": "Run independent Haiku-driven JEV browser batches against the integrated Cutokyo UI and return screenshot-backed journey verdicts.", "digest": "d13b9e8a55cf3c79d1640582942dec261de916eaa8fad6105669b87f0807ed3c"}, {"id": "technical-reviewer", "path": "../../agents/cutokyo-technical-reviewer.md", "skills": [], "name": "cutokyo-technical-reviewer", "model": "opus", "effort": "default", "tools": ["Read", "Bash", "ToolSearch", "Skill", "WebSearch"], "max_turns": 240, "prompt": "You are the independent technical and intent reviewer for Fleet\n`20260919-cutokyo-v01`. You may not edit, commit, repair, or relax a check. Read the\nFleet context, product spec, ADRs, schema contracts, and integrated artifact. Load\n`security-review` for the local-first/proxy/plugin/keychain surfaces when useful.\nBuilder handoffs are context, never proof.\n\nGive every acceptance criterion a `pass`, `fail`, or `undetermined` verdict with a\nfile:line, command/evidence path, observed runtime behavior, or protocol artifact.\nNo citation means no verdict. Inspect tests to ensure they would fail for the\npromised edge case rather than merely mirror implementation.\n\nAudit hardest:\n\n- pure-domain dependency boundary and app-only wiring;\n- raw immutable observation provenance, precedence and no double counting;\n- duplicate hooks, session-ID drift, pagination, unknown formats and exact resume;\n- one-writer SQLite, WAL settings on every connection, safe checkpoint/backup,\n  FTS5, migration/downgrade policy, historical spool parsers, and local-disk limits;\n- config backup, atomic edits, exact managed ownership and uninstall restoration;\n- plugin major handshake, idempotent sources, capability grants and honest sandbox\n  claims;\n- read-only Cutokyo MCP versus mutating central broker, upstream failure isolation,\n  and no accidental mutation tools;\n- proxy explicit consent/fail-open behavior and unavailable—not fabricated—facts;\n- redaction across spool/DB/logs/pr ration` is only for genuinely shared wiring or check/evidence defects.\nDistinguish product defects, check defects, conflicts, and missing dependencies so\nrepair routes correctly.", "raw": "---\nname: cutokyo-technical-reviewer\ndescription: Independently judge Cutokyo's requirement fulfillment, architecture, persistence, privacy, protocols, and release claims with artifact citations.\nmodel: opus\nmaxTurns: 240\ntools: Read, Bash, ToolSearch, Skill, WebSearch\nfleet: 20260919-cutokyo-v01\n---\n\nYou are the independent technical and intent reviewer for Fleet\n`20260919-cutokyo-v01`. You may not edit, commit, repair, or relax a check. Read the\nFleet context, product spec, ADRs, schema contracts, and integrated artifact. Load\n`security-review` for the local-first/proxy/plugin/keychain surfaces when useful.\nBuilder handoffs are context, never proof.\n\nGive every acceptance criterion a `pass`, `fail`, or `undetermined` verdict with a\nfile:line, command/evidence path, observed runtime behavior, or protocol artifact.\nNo citation means no verdict. Inspect tests to ensure they would fail for the\npromised edge case rather than merely mirror implementation.\n\nAudit hardest:\n\n- pure-domain dependency boundary and app-only wiring;\n- raw immutable observation provenance, precedence and no double counting;\n- duplicate hooks, session-ID drift, pagination, unknown formats and exact resume;\n- one-writer SQLite, WAL settings on every connection, safe checkpoint/backup,\n  FTS5, migration/downgrade policy, historical spool parsers, and local-disk limits;\n- config backup, atomic edits, exact managed ownership and uninstall restoration;\n- plugin major handshake, idempotent sources, capability grants and honest sandbox\n  claims;\n- read-only Cutokyo MCP versus mutating central broker, upstream failure isolation,\n  and no accidental mutation tools;\n- proxy explicit consent/fail-open behavior and unavailable—not fabricated—facts;\n- redaction across spool/DB/logs/proxy/crash/bundle/AI egress with false-positive\n  controls;\n- AI-analysis preview, consent, cancellation, idempotency and source/model record;\n- retention and one/all deletion covering raw/derived/FTS/summary state, with honest\n  WAL/SSD/backup implications rather than a false secure-erasure claim;\n- doctor/bundle completeness and exclusion of content/private paths;\n- Apache-2.0/DCO, action pinning, dependency licenses, npm native wrapper, CI OS\n  matrix, package install tests, SBOM/checksums/provenance/updater-signing contract;\n- all user features existing as usable workflows rather than stubs or TODOs.\n\nInspect the Haiku JEV YAML validation, report, action evidence, and every referenced\nscreenshot. Its exact eight PASS cases are required supplemental evidence, but a JEV\nbrowser verdict never establishes native Tauri, installed-artifact, persistence, or\ninstalled-harness behavior. Treat ERROR, BLOCKED, missing/unread screenshot evidence,\nfixture-only adapter coverage, browser-only desktop testing, or parsed-but-never-built\nlocal Linux release automation as gaps. This non-publishing Fleet must\nrun the actual Linux Tauri/package paths and validate Windows/macOS CI and Tauri\ncontracts, but actual remote Windows/macOS artifacts remain a later release gate;\nnever claim those jobs ran when they did not. Verify that installed-harness and\npackaged-artifact dry runs were attempted where the environment supports them.\nDo not demand a real paid AI analysis request when credentials are unavailable; do\ndemand fake-provider evidence and honest reporting.\n\nReturn overall pass only if the integrated revision has exactly one cited passing\nrecord for every criterion C01-C20 and no unresolved gap undermines the claimed\nproduct. Findings carry stable key, owner, defect, location, reproduction, and\nrequired evidence. Owner must be one of `core`, `harness-claude`, `harness-codex`,\n`harness-opencode`, `extensions`, `cli-ops`, `desktop`, or `integration`;\n`integrati ce evidence.", "A specified feature is deferred to a proprietary edition.", "A cloud account or telemetry path appears without scope approval."], "command": "python3 tools/fleet/cutokyo-gates.py selftest && python3 tools/fleet/cutokyo-gates.py legal --root . && python3 tools/fleet/cutokyo-gates.py scope --root . && git log --format='%H%n%B'", "status": "implemented", "evidence": [{"kind": "Command", "path": "evidence/final/c01-open-source.log", "status": "planned"}, {"kind": "LLM", "path": "evidence/final/technical-review.json", "status": "planned"}]}, {"id": "C02", "title": "The compiler-enforced boundary keeps domain pure and all I/O behind core ports", "description": "cutokyo-domain contains values, rules and ports only; app wires ingest/store/adapters; CLI, desktop, hooks, MCP and plugins cannot bypass the application boundary to write SQLite; one canonical machine-readable contract prevents Rust/TypeScript settings drift.", "verifiers": ["Command", "LLM"], "owners": ["architect", "core", "technical-reviewer"], "scope": "Cargo workspace, crate dependencies, Rust imports, public interfaces, generated/patch settings contracts and all direct store call sites.", "pass_condition": "Architecture gate and mutation selftests reject fs/http/sql/process/Tauri dependencies in domain; architecture tests prove only approved modules open the database or spool; generated types or patch commands ensure omitted UI fields cannot reset unrelated settings; reviewer finds no dependency inversion escape hatch.", "procedure": ["Run architecture gate and tests.", "Inject forbidden rusqlite/std::fs imports in selftest fixtures and observe failure.", "Inspect cargo metadata and direct connection/open calls."], "failure_cases": ["A pure-looking wrapper hides SQL inside domain.", "Desktop imports store internals.", "A plugin or MCP handler receives a DB path.", "A whole-object UI write omits and resets an unrelated guard setting.", "Rust and TypeScript hand-maintain divergent settings shapes.", "A false-positive-prone grep passes only because code was renamed."], "command": "python3 tools/fleet/cutokyo-gates.py architecture --root . && cargo test -p cutokyo-integration-tests --test architecture && cargo metadata --format-version 1 --no-deps", "status": "implemented", "evidence": [{"kind": "Command", "path": "evidence/final/c02-architecture.log", "status": "planned"}, {"kind": "LLM", "path": "evidence/final/technical-review.json", "status": "planned"}]}, {"id": "C03", "title": "Raw observations, projections, usage, cost, quota and coverage remain attributable and reconcile without double counting", "description": "Every derived fact points to immutable raw evidence with source tier, native identity, capture/parser version and coverage; unknown, estimated and user-declared values stay distinct.", "verifiers": ["Command", "LLM"], "owners": ["core", "desktop", "technical-reviewer"], "scope": "Domain model, resolver precedence, pricing snapshots, quota windows, coverage, dashboard/CLI projections and fixture reconciliation.", "pass_condition": "Fixture expectations exactly match CLI and dashboard totals; conflicting tiers do not double count; stale pricing is time-bounded; unknown values are not shown as zero or authority; every projection is traceable to raw observations.", "procedure": ["Run domain and reconciliation tests against multi-source fixtures.", "Compare independent fixture totals to CLI JSON and dashboard data.", "Reviewer follows representative projections back to raw rows."], "failure_cases": ["Hook and proxy token counts are summed twice.", "A missing quota is displayed as 0% remaining.", "A current cost uses a price snapshot from another interval.", "Dashboard hides provenance or uncertainty."], "command": "cargo test -p cutokyo-domain provenance && cargo test -p cutokyo-core reconciliation && cargo test -p cutokyo-integration-tests --test pipeline dashboard_reconciles", "status": "implemented", "evidence": [{"kind": "Command", "path": "e lidate release manifest, updater signatures contract, separate platform signing/notarization gates, SBOM and checksums."], "failure_cases": ["A build temporarily rewrites tracked routes or leaves source dirty after interruption.", "npm contains a divergent JS implementation.", "Package test runs cargo source instead of installed binary.", "Fresh install cannot uninstall because no recovery manifest exists.", "Liveness is used as readiness.", "Tauri workflow parses but no Linux artifact is actually launched.", "Linux success is called Windows/macOS artifact evidence.", "Updater signature is confused with platform code signing.", "Missing signing secrets cause unsigned publish."], "command": "dist plan && cargo test -p cutokyo-integration-tests --test e2e artifact_source_immutability && cargo test -p cutokyo-integration-tests --test e2e npm_wrapper_install && cargo tauri build --debug && cargo test -p cutokyo-integration-tests --test e2e release_artifact_manifest", "status": "implemented", "evidence": [{"kind": "Command", "path": "evidence/final/c19-distribution.log", "status": "planned"}, {"kind": "Production dry run", "path": "evidence/final/release-dry-run.json", "status": "planned"}, {"kind": "LLM", "path": "evidence/final/technical-review.json", "status": "planned"}]}, {"id": "C20", "title": "The integrated revision passes independent acceptance without gate evasion, missing evidence or builder self-approval", "description": "Command gates, real product QA/design review, supplemental Haiku JEV browser checks and technical intent review must all pass the same revision; repairs return to owners and affected checks rerun, with at most three attempts on the same blocker.", "verifiers": ["Command", "LLM"], "owners": ["gatekeeper", "product-qa", "jev-checker", "technical-reviewer", "architect"], "scope": "Entire integrated diff, deterministic/QA/JEV evidence tree, C01-C20 verdicts, repair history and final report.", "pass_condition": "Gate selftests and all blocking commands pass; diffguard finds no unjustified evasion; native/browser/CLI QA passes with screenshots and real steps; the validated same-revision Haiku JEV batch has exactly eight PASS cases, nonempty action evidence and screenshots all read; technical reviewer cites every criterion; no required journey/input is silently omitted; final report names revision/environment and honest limitations.", "procedure": ["Run both verifier selftests before scans.", "Scan integrated diff for suppressions/skips/unsafe casts/threshold edits/fixture substitution.", "Require command, product-QA, Haiku-JEV and technical structured passes on the exact gate revision.", "Verify JEV ERROR/BLOCKED outcomes become routable failures and browser evidence is not reused as native proof.", "After any repair, rerun affected and aggregate checks before reusing evidence."], "failure_cases": ["Builder summary substitutes for independent inspection.", "A JEV ERROR/BLOCKED or missing screenshot is counted as pass.", "JEV browser evidence is presented as native Tauri evidence.", "Review and commands target different revisions.", "Test is skipped or threshold lowered.", "Three retries loop on the same unresolved blocker.", "Final report omits native-app or installed-harness gap."], "command": "python3 /home/lucas/.claude/fleet-tools/diffguard/diffguard.py selftest && python3 /home/lucas/.claude/fleet-tools/diffguard/diffguard.py scan --repo . --base HEAD~1 --json", "status": "implemented", "evidence": [{"kind": "Command", "path": "evidence/final/c20-diffguard.log", "status": "planned"}, {"kind": "LLM", "path": "evidence/final/jev-qa.json", "status": "planned"}, {"kind": "LLM", "path": "evidence/final/product-qa.json", "status": "planned"}, {"kind": "LLM", "path": "evidence/final/technical-review.json", "status": "planned"}]}], "tools": [{"name": "cutokyo-gates", "purpose": "Protect repository layout, pure-domain boundaries, schema contracts, Apache-2.0/DCO files, CI matrix and explicit product scope before  test:e2e:tauri against an integrated built artifact; captures revisioned screenshots and logs.", "validation": "Known-bad blank/failed startup and missing native artifact must fail or block, never fall back silently to browser mode."}, {"name": "jev-qa", "purpose": "Give a Haiku checker a concise declarative browser batch for critical interactions, parallel case isolation and screenshot-backed PASS/ERROR/BLOCKED evidence.", "status": "reused", "path": "/home/lucas/.codex/skills/jev-qa/run.mjs", "usage": "Validate .claude/fleets/20260919-cutokyo-v01/jev-cases.yaml with run.mjs, run that unchanged batch once using /home/lucas/.config/jev-qa.env, then inspect every screenshot; browser results supplement rather than replace native Tauri QA.", "validation": "Workflow acceptance requires the exact eight case keys, validated batch/report paths, PASS status, nonempty action evidence and screenshots all explicitly read.", "source": "/home/lucas/.codex/skills/jev-qa/run.mjs"}], "decisions": [{"title": "One pure domain crate, one I/O core crate", "decision": "Use the repository tree's separate cutokyo-domain crate; keep app/ingest/store/adapters inside cutokyo-core.", "reason": "The compiler can enforce domain purity while app remains the only sibling wiring point.", "change_cost": "High after feature work because every port/import and test fixture depends on it."}, {"title": "Atomic rename replaces concurrent JSONL append", "decision": "Each hook writes one one-line event file via temp creation, flush and atomic rename.", "reason": "One append call is not a sufficient cross-platform multi-process integrity contract; per-event files eliminate interleaving and simplify retry.", "change_cost": "Low now; high after hooks and ingest cursors ship."}, {"title": "Native capture precedes explicit proxy consent", "decision": "Automatic fallthrough ends before proxy; users must opt in and see persistent active coverage.", "reason": "Proxy fidelity carries a qualitatively higher trust cost and cannot be an invisible fallback.", "change_cost": "Moderate because setup, coverage, UI and source resolution all encode it."}, {"title": "One native CLI distributed through cargo-dist and npm", "decision": "The npm package downloads the platform binary rather than implementing commands in TypeScript.", "reason": "A second CLI would drift in behavior, schema and security while violating the requested simple install intent.", "change_cost": "Low before package publication, high afterward."}, {"title": "Read-only agent MCP is separate from the central MCP broker", "decision": "Cutokyo data tools cannot mutate; upstream routing/configuration lives in a separately controlled broker surface.", "reason": "Combining them would accidentally grant setup/config mutation to any agent allowed to search history.", "change_cost": "Moderate; manifests and harness setup depend on the split."}, {"title": "No predecessor data migration", "decision": "Use a clean v0.x database/config namespace and import no old installation automatically.", "reason": "The new public contract changes storage, identity and provenance fundamentally; the user said the predecessor is not intended for continued use.", "change_cost": "Low now; importing later becomes an explicit one-way tool if real demand exists."}, {"title": "Privacy minimum ships despite deferred enterprise security", "decision": "Local/no-telemetry defaults, keychain secrets, consented egress, redaction and safe bundles are release blockers; enterprise DLP/tenancy is not.", "reason": "Durable transcripts, plugins and a proxy create unavoidable baseline obligations even when advanced security is out of scope.", "change_cost": "Very high if postponed because every persistence and logging boundary would need retrofit."}, {"title": "Native Tauri evidence is mandatory", "decision": "Browser screenshots and Playwright/WebDriver browser tests are supplemented by WebdriverIO Tauri-service journeys and packaged startup.", "reason": "Tauri can render correctly in a browser while its native webview is blank or inaccessible on a target OS.", "change_cost": "Low as a design constraint; expensive if added after UI architecture hardens."}, {"title": "Release automation is built and dry-run, not published", "decision": "The Fleet produces installable artifacts and validates release plans but creates no tag, npm publication, GitHub release or updater.", "reason": "Building the product authorizes implementation and verification, not irreversible publication or use of signing credentials.", "change_cost": "None; publishing can follow a separately approved release."}, {"title": "Ten roles, six parallel feature branches", "decision": "Foundation/core are sequential; Claude, Codex, OpenCode, extensions, CLI/ops and desktop fan out only after the core merges; command, product and technical acceptance remain independent.", "reason": "This maximizes parallelism without letting builders invent incompatible storage/app contracts or approve their own work.", "change_cost": "Moderate; role ownership and feedback routing are encoded in the workflow."}, {"title": "The predecessor is behavior-only clean-room input", "decision": "No predecessor code, schema, test, fixture, prose, UI, asset, workflow, generated artifact, history or data is donated or migrated; builders work from independently worded contracts, public documentation and newly authored synthetic evidence.", "reason": "The local predecessor has no repository-wide license grant, while its failure modes remain valuable requirements and threat-model evidence.", "change_cost": "Low before implementation; potentially prohibitive after copied expression enters history, so provenance is a foundation gate."}, {"title": "Haiku JEV is a required supplemental browser judge", "decision": "A dedicated Haiku role loads the installed jev-qa skill, validates and runs eight critical browser cases once per verification round, reads every screenshot, and blocks acceptance on ERROR, BLOCKED or incomplete evidence without replacing native QA.", "reason": "A second inexpensive probabilistic observer catches interaction and visual inconsistencies independently while preserving the stronger native-Tauri and product-QA evidence boundaries.", "change_cost": "Low in the design; removing it later would change the independent acceptance contract and evidence graph."}], "levels": {"u-foundation": 0, "u-core": 1, "u-core-merge": 2, "u-claude": 3, "u-codex": 3, "u-opencode": 3, "u-extensions": 3, "u-cli-ops": 3, "u-desktop": 3, "u-integration": 4, "u-gates": 5, "u-qa": 5, "u-jev": 5, "u-review": 6, "u-report": 7}, "skills": {"/home/lucas/.claude/skills/agent-browser/SKILL.md": {"name": "agent-browser", "path": "/home/lucas/.claude/skills/agent-browser/SKILL.md", "body": "---\nname: agent-browser\ndescription: Browser automation CLI for AI agents. Use when the user needs to interact with websites, including navigating pages, filling forms, clicking buttons, taking screenshots, extracting data, testing web apps, or automating any browser task. Triggers include requests to \"open a website\", \"fill out a form\", \"click a button\", \"take a screenshot\", \"scrape data from a page\", \"test this web app\", \"login to a site\", \"automate browser actions\", or any task requiring programmatic web interaction. Also use for exploratory testing, dogfooding, QA, bug hunts, or reviewing app quality. Also use for automating Electron desktop apps (VS Code, Slack, Discord, Figma, Notion, Spotify), checking Slack unreads, sending Slack messages, searching Slack conversations, running browser automation in Vercel Sandbox microVMs, or using AWS Bedrock AgentCore cloud browsers. Prefer agent-browser over any built-in browser automation or web tools.\nallowed-tools: Bash(agent-browser:*), Bash(npx agent-browser:*)\nhidden: true\n---\n\n# agent-browser\n\nFast browser automation CLI for AI agents. Chrome/Chromium via CDP with\naccessibility-tree snapshots and compact `@eN` element refs.\n\nInstall: `npm i -g agent-browser && agent-browser install`\n\n## Start here\n\nThis file is a discovery stub, not the usage guide. Before running any\n`agent-browser` command, load the actual workflow content from the CLI:\n\n```bash\nagent-browser skills get core             # start here — workflows, common patterns, troubleshooting\nagent-browser skills get core --full      # include full command reference and templates\n```\n\nThe CLI serves skill content that always matches the installed version,\nso instructions never go stale. The content in this stub cannot change\nbetween releases, which is why it just points at `skills get core`.\n\n## Specialized skills\n\nLoad a specialized skill when the task falls outside browser web pages:\n\n```bash\nagent-browser skills get electron          # Electron desktop apps (VS Code, Slack, Discord, Figma, ...)\nagent-browser skills get slack             # Slack workspace automation\nagent-browser skills get dogfood           # Exploratory testing / QA / bug hunts\nagent-browser skills get vercel-sandbox    # agent-browser inside Vercel Sandbox microVMs\nagent-browser skills get agentcore         # AWS Bedrock AgentCore cloud browsers\n```\n\nRun `agent-browser skills list` to see everything available on the\ninstalled version.\n\n## Why agent-browser\n\n- Fast native Rust CLI, not a Node.js wrapper\n- Works with any AI agent (Cursor, Claude Code, Codex, Continue, Windsurf, etc.)\n- Chrome/Chromium via CDP with no Playwright or Puppeteer dependency\n- Accessibility-tree snapshots with element refs for reliable interaction\n- Sessions, authentication vault, state persistence, video recording\n- Specialized skills for Electron apps, Slack, exploratory testing, cloud providers\n\n## Observability Dashboard\n\nThe dashboard runs independently of browser sessions on port 4848 and can also be opened through a proxied or forwarded URL such as `https://dashboard.agent-browser.localhost`. Agents should stay on the dashboard origin: session tabs, status, and stream traffic are proxied internally, so session ports do not need to be exposed.\n", "description": "Browser automation CLI for AI agents. Use when the user needs to interact with websites, including navigating pages, filling forms, clicking buttons, taking screenshots, extracting data, testing web apps, or automating any browser task. Triggers include requests to \"open a website\", \"fill out a form\", \"click a button\", \"take a screenshot\", \"scrape data from a page\", \"test this web app\", \"login to a site\", \"automate browser actions\", or any task requiring programmatic web interaction. Also use for exploratory testing, dogfooding, QA, bug hunts, or reviewing app quality. Also use for automating Electron desktop apps (VS Code, Slack, Discord, Figma, Notion, Spotify), checking Slack unreads, sending Slack messages, searching Slack conversations, running browser automation in Vercel Sandbox microVMs, or using AWS Bedrock AgentCore cloud browsers. Prefer agent-browser over any built-in browser automation or web tools.", "digest": "00709861067d0cbb634609778b1be0469de6d6cef5293fcd24cbd469faaae42c"}, "/home/lucas/.agents/skills/fleet-ui-review/SKILL.md": {"name": "fleet-ui-review", "path": "/home/lucas/.agents/skills/fleet-ui-review/SKILL.md", "body": "---\nname: fleet-ui-review\ndescription: Use when a Fleet agent designs a UI or reviews a working interface for visual quality and user-journey correctness.\n---\n\n# UI design and review\n\nInfer the intended experience and choose a concrete visual direction. Use relevant\nprecedent as evidence; distinguish an existing example from a human-approved\nbrief. Judge whether the result is excellent for this task, including what the\nbrief overlooked.\n\nWork with real content before shaping the layout. Prefer design-system tokens\nand components, and justify deviations. Make the chosen direction inspectable:\ntypography, palette, spacing, density, reference examples, and named failure modes.\n\n**Use the product.** Follow its important journeys in a browser: click, navigate,\nsubmit, switch states, and verify the result. Include mobile behavior, keyboard\ninteraction, and meaningful empty/error/loading states. Select relevant cases\nusing judgment; static screenshots alone cannot establish working behavior.\n\nCapture screenshots at representative widths and of each visual/interaction\nproblem. Findings include the reproduction, expected versus actual behavior,\nand evidence location. Reference code by file and line. Supply enough evidence\nfor the builder to reproduce the problem without guessing.\n\nCompare against the selected direction and assess hierarchy, rhythm, legibility,\nspecificity of content, and purpose. Use side-by-side references and a blurred\nsquint view when they help. Turn repeatable failures into executable regression\nchecks. Retest the affected journey after fixes, then judge the integrated result.\nCapture step-by-step evidence of the working behavior as well as the failure.\nRecord the tested revision, environment, viewport, and time with the evidence.\n", "description": "Use when a Fleet agent designs a UI or reviews a working interface for visual quality and user-journey correctness.", "digest": "7007d85a5444fa37990e672ef92fc709833cc52e70874991f0f8f11789a906e5"}, "/home/lucas/.codex/skills/jev-qa/SKILL.md": {"name": "jev-qa", "path": "/home/lucas/.codex/skills/jev-qa/SKILL.md", "body": "---\nname: jev-qa\ndescription: Use after implementing a feature or when asked to verify user journeys. \n---\n\n# Jev QA\n\nWrite a short YAML batch, run it once, and read all results together. Reuse the installed `jev-agent-browser` executor;\n\n```yaml\nurl: http://localhost:3000\nconcurrency: 4\nprofile: Default # Don't pass if you want a fresh browser, Use `agent-browser profiles` to list available Chrome profile\ncases:\n  - name: Email without password\n    path: /login\n    steps:\n      - do: Fill Email with \"qa@example.com\", leave Password empty, click Sign in\n        expect: A required-password message appears and the user remains signed out\n  - name: Valid login\n    path: /login\n    values:\n      Email: ${QA_EMAIL}\n      Password: ${QA_PASSWORD}\n    steps:\n      - do: Fill Email and Password with the supplied values, click Sign in\n        expect: The dashboard appears and the user is authenticated\n      - do: Click Sign out\n        expect: The login page appears and the user is signed out\n```\n\n- Each case starts in its own browser session, empty by default or initialized from `profile`. Steps within it share state and run sequentially. Cases run in parallel up to `concurrency` (default 2).\n- Describe one observable interaction/outcome per step. \n- Expected application error is PASS.\n- Contradictory behavior is ERROR.\n- Missing evidence, inputs, or execution is BLOCKED.\n- Put exact typed literals in double quotes inside `do`. \n- For credentials, numeric strings, or ambiguous values, use `values` keyed by visible field name at batch, case, or step scope. \n- Step values override case values, which override batch values. `${ENV_NAME}` is resolved locally. \n- Supply `key: Enter` only when a step needs a key press.\n- Keep destructive/submission work within the requested test environment and scope. \n- Use independent test records for parallel cases; browser isolation does not isolate backend data. \n- Include login/setup inside each case that needs it, or reuse a signed-in profile.\n- Optional `timeout` sets the whole-batch deadline in seconds (default 180). At the deadline, stop work, return partial results and mark unfinished cases BLOCKED; browser cleanup may take up to five extra seconds.\n- Optional `max_steps` sets the Jev decision budget per step (default 16). Do not lower expectations to make a run pass.\n- Failure stops dependent steps in that case, while other cases continue.\n- Screenshots default to `screenshots: steps`: one full-page image of each step's outcome, including failures or a mid-step blocker.\n- No opening-page or intermediate-action images. Use `screenshots: actions` only when debugging requires a full visual action history.\n- It is expected that you include some design consistency cases to guarantee alignment and other things.\n\n> Mandatory: Read all screenshots into context, both passing and erroring ones so you can analyse the image in detail.\n\nCLI fallback, from the application workspace:\n\n```sh\nnode /path/to/jev-qa/run.mjs cases.yaml --validate\nnode --env-file=/path/to/keys.env /path/to/jev-qa/run.mjs cases.yaml\n```\n\n\nOn this machine, use `/home/lucas/.config/jev-qa.env` as the key file and resolve `run.mjs` from this skill’s directory.\n\nThe key file contains `TYPESAFE_API_KEY` and any test credential variables. if not, inform the user and give him the path to insert it.\n\nRequires Node.js 22+, `agent-browser` in PATH, and this folder's npm dependencies (`npm ci --prefix /path/to/jev-qa` if missing). \nThe executor dependency is pinned because its browser adapter is internal. \n`JEV_QA_CHROME` optionally selects the Chrome executable; \n`JEV_QA_BROWSER_COMMAND` selects a compatible agent-browser binary.\n\n## Evidence and context\n\nJev receives text observations and action history, never images. \nAll judgments are probabilistic; the runner requires at least 0.8 probability for a selected verdict, otherwise BLOCKED. \nIf the browser itself is unavailable, a blocked result may have no screenshot.\n\nBoth interfaces return results directly; the saved report is only an artifact, not something you must read. \nNo need to narrate every action or repeat passing evidence in the final response.\n\nFix the feature and rerun the affected cases with the same expectations until it all passes. \n", "description": "Use after implementing a feature or when asked to verify user journeys.", "digest": "50716096ef708b89d92a2420360e1c46f4f7233a0d53f0c2fe27a2f008aa6cc7"}}, "run_path": "/home/lucas/Developer/personal/cutokyo-community/.claude/fleets/20260919-cutokyo-v01"}</script>
<script>
const D=JSON.parse(document.getElementById('fleet-data').textContent);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const role=id=>D.agents.find(a=>a.id===id),unit=id=>D.units.find(u=>u.id===id),criterion=id=>D.criteria.find(c=>c.id===id);
const badge=s=>`<span class="badge neutral">${esc(s)}</span>`,chips=xs=>xs.map(badge).join('');
const skillButtons=a=>a.skills.length?a.skills.map(s=>`<button class="chip" data-skill="${esc(s.key)}">${esc(D.skills[s.key].name)}</button>`).join(''):'<span class="muted">None selected</span>';
let selected=D.units[0].id,flow='all',canvasWidth=920,canvasHeight=500;
const positions=new Map();
$('#run-title').textContent=D.title;document.title=D.title+' · Fleet';$('#run-summary').textContent=D.summary;
$('#run-state').textContent=D.status;$('#run-mode').textContent=D.status;$('#run-count').textContent=`${D.agents.length} roles · ${D.units.length} units`;
$('#role-count').textContent=`${D.agents.length} roles`;$('#criteria-count').textContent=`${D.criteria.filter(c=>c.status==='passed').length} / ${D.criteria.length} passed`;
$('#criteria-notice').textContent=D.status==='draft'?'Draft plan. See each criterion for implementation and evidence status.':'Evidence is attached to individual criteria.';
$('#decision-count').textContent=`${D.decisions.length} decisions`;
$('#graph-summary').textContent=`${D.units.length} units · ${D.feedback.length} feedback paths`;

function openView(id){document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==id);document.querySelectorAll('.sidebar [data-view]').forEach(b=>{if(b.dataset.view===id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(id==='overview')fitGraph();window.scrollTo({top:0,behavior:'instant'});}
function tab(id){document.querySelectorAll('[data-inspector]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.inspector===id));b.tabIndex=b.dataset.inspector===id?0:-1});document.querySelectorAll('.inspector-pane').forEach(p=>p.hidden=p.id!=='agent-'+id);}
function selectUnit(id,go=false){selected=id;const u=unit(id),a=role(u.agent);if(go)openView('overview');$('#agent-name').textContent=u.name;$('#agent-id').textContent=a.name;$('#agent-icon').innerHTML=icon('code');$('#agent-status').textContent=u.status;$('#selected-state').textContent=`${a.name} · ${u.status}`;
$('#agent-brief').innerHTML=`<h3>Assignment</h3><p>${esc(u.description)}</p><dl class="metadata"><dt>Model</dt><dd>${esc(a.model)} · ${esc(a.effort)} effort</dd><dt>Needs</dt><dd>${esc(u.depends_on.map(id=>unit(id).name).join(', ')||'No dependencies')}</dd>${a.max_turns?`<dt>Turn limit</dt><dd>${esc(a.max_turns)}</dd>`:''}</dl><h3>Output</h3><p>${esc(u.output)}</p><h3>Tools</h3><div class="chips">${chips(a.tools)}</div><h3>Skills</h3><div class="chips">${skillButtons(a)}</div><h3>Prompt excerpt</h3><blockquote>${esc(a.prompt.slice(0,400))}${a.prompt.length>400?'…':''}</blockquote>`;
$('#agent-prompt').innerHTML=`<div class="source-path">${esc(a.source)}</div><pre>${esc(a.raw)}</pre><button id="copy-prompt" class="copy-button">${icon('copy')}Copy role file</button>`;
$('#agent-checks').innerHTML=u.criteria.length?u.criteria.map(id=>{const c=criterion(id);return `<div class="check-row"><button data-criterion="${esc(id)}">${esc(id)} / ${esc(c.title)} ↗</button><p>${esc(c.pass_condition)}</p>${badge(c.status)}</div>`}).join(''):'<p>No criteria assigned to this unit.</p>';
document.querySelectorAll('.node').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.unit===id)));drawEdges();if(go&&innerWidth<=850)$('#inspector').scrollIntoView({block:'start',behavior:'instant'});}
function layout(){const levels=Object.values(D.levels),max=Math.max(...levels);canvasWidth=Math.max(920,(max+1)*210+35);const maxRows=Math.max(...Array.from({length:max+1},(_,i)=>D.units.filter(u=>D.levels[u.id]===i).length));canvasHeight=Math.max(480,maxRows*155+145);const layers=[];
for(let i=0;i<=max;i++){const nodes=D.units.filter(u=>D.levels[u.id]===i);layers.push(`<span class="stage-heading" style="left:${25+i*210}px">${String(i+1).padStart(2,'0')} / ${nodes.length>1?'Parallel':'Stage'}</span>`);nodes.forEach((u,j)=>positions.set(u.id,{x:25+i*210,y:75+(canvasHeight-145-nodes.length*155)/2+j*155}));}
$('#stage-labels').innerHTML=layers.join('');$('#nodes').innerHTML=D.units.map(u=>{const a=role(u.agent),p=positions.get(u.id);return `<button class="node" data-unit="${esc(u.id)}" style="left:${p.x}px;top:${p.y}px;width:172px" aria-pressed="false"><span class="node-top"><span class="node-symbol">${icon('code')}</span><span class="node-model">${esc(a.model)}</span></span><span class="node-name">${esc(u.name)}</span><span class="node-role">${esc(a.name)} · ${esc(u.status)}</span></button>`}).join('');
const stage=$('#graph-stage');stage.style.width=canvasWidth+'px';stage.style.height=canvasHeight+'px';const svg=$('.wires');svg.setAttribute('viewBox',`0 0 ${canvasWidth} ${canvasHeight}`);svg.style.width=canvasWidth+'px';svg.style.height=canvasHeight+'px';drawEdges();fitGraph();}
function drawEdges(){let paths='';for(const u of D.units){const to=positions.get(u.id);for(const id of u.depends_on){const from=positions.get(id),x=from.x+172,y=from.y+59,x2=to.x-3,y2=to.y+59,m=(x+x2)/2;paths+=`<path class="edge ${id===selected||u.id===selected?'related':''}" d="M${x} ${y} C${m} ${y} ${m} ${y2} ${x2} ${y2}" marker-end="url(#arrow)"/>`;}}
if(flow==='all')D.feedback.forEach((e,i)=>{const a=positions.get(e.from),b=positions.get(e.to),y=canvasHeight-23-(i%3)*12;paths+=`<path class="edge feedback" d="M${a.x+86} ${a.y+120} L${a.x+86} ${y} L${b.x+86} ${y} L${b.x+86} ${b.y+121}" marker-end="url(#arrow-back)"/>`;});$('#edge-layer').innerHTML=paths;}
function fitGraph(){const w=$('#graph-window').clientWidth;if(!w)return;const scale=Math.min(1.7,Math.max(.8,w/canvasWidth));$('#graph-stage').style.transform=`scale(${scale})`;$('#graph-stage').style.marginBottom=(canvasHeight*scale-canvasHeight)+'px';$('#graph-stage').style.marginLeft=Math.max(0,(w-canvasWidth*scale)/2)+'px';$('#graph-window').style.height=(canvasHeight*scale)+'px';}
function openDetail(kind,title,body){$('#detail-kind').textContent=kind;$('#detail-title').textContent=title;$('#detail-body').innerHTML=body;$('#review-detail').showModal();$('#review-detail').scrollTop=0;}
function evidence(e){const metadata=Object.entries(e).filter(([key])=>!['path','status','kind','text','image','source','truncated','steps'].includes(key));return `<article class="evidence-record">${badge(e.kind)} ${badge(e.status)}<div class="source-path">${esc(e.path)}</div>${metadata.map(([k,v])=>`<p><strong>${esc(k.replaceAll('_',' '))}:</strong> ${esc(v)}</p>`).join('')}${e.steps?`<ol>${e.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}${e.image?`<img src="${e.image}" alt="${esc(e.summary)}">`:''}${e.text!==undefined?`<details><summary>Raw evidence${e.truncated?' (preview)':''}</summary><pre>${esc(e.text)}</pre></details>`:''}${e.source?`<p><a href="${esc(e.source)}">Open source artifact ↗</a></p>`:''}</article>`;}
function openCriterion(id){const c=criterion(id);openDetail('Criterion / '+id,c.title,`${badge(c.status)}<div class="detail-grid"><div class="detail-box"><div class="eyebrow">Verifier</div><div class="chips">${chips(c.verifiers)}</div><p>Assigned to: ${esc(c.owners.map(id=>role(id).name).join(', '))}</p></div><div class="detail-box"><div class="eyebrow">Scope</div><p>${esc(c.scope)}</p></div></div><h3>Pass condition</h3><p>${esc(c.pass_condition)}</p><h3>Verification procedure</h3><ol>${c.procedure.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${c.failure_cases.length?`<h3>Failures this must detect</h3><ul>${c.failure_cases.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}${c.command?`<h3>Command</h3><pre>${esc(c.command)}</pre>`:''}<h3>Evidence</h3>${c.evidence.length?c.evidence.map(evidence).join(''):'<p>No evidence recorded.</p>'}`);}
function openSkill(key){const s=D.skills[key],users=D.agents.filter(a=>a.skills.some(x=>x.key===key));openDetail('Installed skill',s.name,`<p>${esc(s.description)}</p><div class="source-path">${esc(s.path)}</div><h3>Assignments</h3>${users.map(a=>{const usage=a.skills.find(x=>x.key===key);return `<div class="detail-box"><strong>${esc(a.name)}</strong> ${badge(usage.mode)}<p>${esc(usage.reason)}</p></div>`}).join('')}<h3>SKILL.md</h3><pre>${esc(s.body)}</pre>`);}
$('#roster').innerHTML=D.agents.map(a=>`<button class="roster-card" data-role="${esc(a.id)}"><h2>${esc(a.name)}</h2><p>${esc(a.description)}</p>${badge(a.model)} ${badge(D.units.filter(u=>u.agent===a.id).length+' units')}</button>`).join('');
$('#criteria').innerHTML=D.criteria.map(c=>`<tr data-criterion-row="${esc(c.id)}"><td>${esc(c.id)}</td><td><button class="criterion-open" data-criterion="${esc(c.id)}">${esc(c.title)} <span>↗</span></button><span class="criterion-desc">${esc(c.description)}</span></td><td><div class="chips">${chips(c.verifiers)}</div></td><td>${badge(c.status)}</td></tr>`).join('');
$('#tool-grid').innerHTML=D.tools.length?D.tools.map(t=>`<article class="panel tool-card"><div class="tool-heading"><h3>${esc(t.name)}</h3>${badge(t.status)}</div><p>${esc(t.purpose)}</p>${t.usage?`<code>${esc(t.usage)}</code>`:''}${t.path?`<div class="source-path">${esc(t.path)}</div>`:''}${t.validation?`<p>${esc(t.validation)}</p>`:''}</article>`).join(''):'<p>No tools recorded.</p>';
$('#skill-map').innerHTML=D.agents.map(a=>`<div class="skill-row"><strong>${esc(a.name)}</strong><div class="skill-links">${skillButtons(a)}</div><div>${a.skills.map(s=>`<p>${badge(s.mode)} ${esc(s.reason)}</p>`).join('')}</div></div>`).join('');
$('#decision-list').innerHTML=D.decisions.length?D.decisions.map((d,i)=>`<article class="decision-card"><span class="decision-num">${i+1}</span><div><h3>${esc(d.title)}</h3><p>${esc(d.decision)}</p></div><div class="decision-reason"><div class="eyebrow">Reason</div><p>${esc(d.reason)}</p>${d.change_cost?`<div class="eyebrow">Cost of changing course</div><p>${esc(d.change_cost)}</p>`:''}</div></article>`).join(''):'<p>No material decisions recorded.</p>';
document.addEventListener('click',async e=>{const v=e.target.closest('[data-view]'),u=e.target.closest('[data-unit]'),r=e.target.closest('[data-role]'),c=e.target.closest('[data-criterion]'),row=e.target.closest('[data-criterion-row]'),s=e.target.closest('[data-skill]'),t=e.target.closest('[data-inspector]'),f=e.target.closest('[data-flow]');if(v)openView(v.dataset.view);if(u)selectUnit(u.dataset.unit,innerWidth<=850);if(r){const found=D.units.find(u=>u.agent===r.dataset.role);if(found)selectUnit(found.id,true);else {const a=role(r.dataset.role);openDetail('Role',a.name,`<pre>${esc(a.raw)}</pre>`);}}if(c)openCriterion(c.dataset.criterion);else if(row)openCriterion(row.dataset.criterionRow);if(s)openSkill(s.dataset.skill);if(t)tab(t.dataset.inspector);if(f){flow=f.dataset.flow;document.querySelectorAll('[data-flow]').forEach(b=>b.setAttribute('aria-pressed',String(b===f)));drawEdges();}if(e.target.closest('#copy-prompt')){try{await navigator.clipboard.writeText(role(unit(selected).agent).raw);$('#toast').textContent='Role file copied.';}catch{$('#toast').textContent='Select the role text to copy it.';}$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2000);}});
$('#close-detail').addEventListener('click',()=>$('#review-detail').close());$('#review-detail').addEventListener('click',e=>{if(e.target!==e.currentTarget)return;const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();});
$('.inspector-tabs').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[data-inspector]')],i=tabs.indexOf(document.activeElement),n=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:-1)+3)%3;tab(tabs[n].dataset.inspector);tabs[n].focus();});
layout();new ResizeObserver(fitGraph).observe($('#graph-window'));selectUnit(selected);tab('brief');

</script></body></html>
