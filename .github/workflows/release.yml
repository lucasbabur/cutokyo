name: Signed release and dry-run artifacts

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attest local artifacts without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_DIST_VERSION: "0.32.0"
  CARGO_CYCLONEDX_VERSION: "0.5.9"

jobs:
  release-contract:
    name: Plan, signing preflight, and CycloneDX SBOM
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select immutable release mode
        id: release
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "cutokyo-cli") | .version')"
          tauri_version="$(jq -er '.version' crates/cutokyo-desktop/tauri.conf.json)"
          workspace_version="$(jq -er '.version' package.json)"
          ui_version="$(jq -er '.version' ui/package.json)"
          if [[ "$tauri_version" != "$version" || "$workspace_version" != "$version" || "$ui_version" != "$version" ]]; then
            printf 'Release refused: Cargo (%s), Tauri (%s), workspace (%s), and UI (%s) versions must match.\n' \
              "$version" "$tauri_version" "$workspace_version" "$ui_version" >&2
            exit 65
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
              printf 'Release refused: tag must exactly equal the Cargo version as vMAJOR.MINOR.PATCH with an optional SemVer suffix.\n' >&2
              exit 64
            fi
            printf 'tag=%s\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
          else
            test '${{ inputs.dry_run }}' = 'true'
            printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Fail clearly when tag signing or publication credentials are absent
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          missing=()
          for name in NPM_TOKEN TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBLIC_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Release refused: required signing/publication secrets are absent: %s\n' "${missing[*]}" >&2
            exit 78
          fi
      - name: Install pinned cargo-dist without source rewrites
        run: python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/install-dist-source.json" -- cargo install cargo-dist --version "$CARGO_DIST_VERSION" --locked
      - name: Validate and preserve cargo-dist plan without source rewrites
        run: python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/dist-plan-source.json" -- dist plan --tag="${{ steps.release.outputs.tag }}" --output-format=json > cargo-dist-plan.json
      - name: Generate CycloneDX SBOM without source rewrites
        run: |
          python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/install-cyclonedx-source.json" -- cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
          mkdir -p release-contract/sbom
          python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/cyclonedx-source.json" -- cargo cyclonedx --all --format json
          find . -name '*.cdx.json' -not -path './target/*' -not -path './release-contract/*' -exec cp {} release-contract/sbom/ \;
          test -n "$(find release-contract/sbom -type f -name '*.cdx.json' -print -quit)"
      - name: Create contract checksums
        run: |
          cp cargo-dist-plan.json release-contract/
          find release-contract -type f ! -name RELEASE-CONTRACT-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release-contract/RELEASE-CONTRACT-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-contract
          path: release-contract
          if-no-files-found: error

  cli-artifacts:
    name: cargo-dist native CLI (${{ matrix.target }})
    needs: release-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned cargo-dist
        run: python tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "${{ runner.temp }}/install-dist-source.json" -- cargo install cargo-dist --version "${{ env.CARGO_DIST_VERSION }}" --locked
        if: runner.os == 'Windows'
      - name: Install pinned cargo-dist
        run: python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/install-dist-source.json" -- cargo install cargo-dist --version "$CARGO_DIST_VERSION" --locked
        if: runner.os != 'Windows'
      - name: Build target-native cargo-dist artifacts without source rewrites
        shell: bash
        run: python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/dist-build-source.json" -- dist build --tag="${{ needs.release-contract.outputs.tag }}" --artifacts=local --target="${{ matrix.target }}" --output-format=json
      - name: Copy cargo-dist output and smoke the packaged executable
        shell: bash
        run: |
          mkdir -p release-artifacts
          find target/distrib -maxdepth 1 -type f -name "*${{ matrix.target }}*" -exec cp {} release-artifacts/ \;
          test -n "$(find release-artifacts -type f -name "*${{ matrix.target }}*" -print -quit)"
          python3 tools/release/smoke-dist.py --artifacts release-artifacts --target "${{ matrix.target }}" --expected-version "${{ needs.release-contract.outputs.tag }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.target }}
          path: release-artifacts
          if-no-files-found: error

  global-installers:
    name: cargo-dist shell, PowerShell, and npm installers
    needs: release-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned cargo-dist
        run: python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/install-dist-source.json" -- cargo install cargo-dist --version "$CARGO_DIST_VERSION" --locked
      - name: Build global installers without source rewrites
        run: python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/dist-global-source.json" -- dist build --tag="${{ needs.release-contract.outputs.tag }}" --artifacts=global --output-format=json
      - name: Locally pack the generated npm installer without source rewrites
        run: |
          npm_source="$(find target/distrib -type f -name '*npm-package.tar.gz' -print -quit)"
          test -n "$npm_source"
          rm -rf target/npm-wrapper
          mkdir -p target/npm-wrapper global-installers
          tar --extract --gzip --file "$npm_source" --directory target/npm-wrapper
          npm_directory="$(dirname "$(find target/npm-wrapper -type f -name package.json -print -quit)")"
          test -n "$npm_directory"
          python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/npm-pack-source.json" -- npm pack "./$npm_directory" --pack-destination ./global-installers
          mkdir -p global-installers/npm-dependencies
          cp tests/fixtures/release/detect-libc-2.1.2.tgz global-installers/npm-dependencies/
          cp target/distrib/*installer* global-installers/
          test -n "$(find global-installers -type f -name 'cutokyo-*.tgz' -print -quit)"
          test -n "$(find global-installers/npm-dependencies -type f -name 'detect-libc-2.1.2.tgz' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: global-installers
          path: global-installers
          if-no-files-found: error

  tauri-artifacts:
    name: Tauri package (${{ matrix.os }})
    needs: release-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            updater-platform: linux-x86_64
            release-bundles: deb,appimage
          - os: macos-14
            target: aarch64-apple-darwin
            updater-platform: darwin-aarch64
            release-bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            updater-platform: windows-x86_64
            release-bundles: msi
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cutokyo-tauri-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Enable pinned pnpm and install Tauri CLI without source rewrites
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          python tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "${{ runner.temp }}/pnpm-install-source.json" -- pnpm install --frozen-lockfile
      - name: Install Linux native desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Import Apple Developer ID certificate for tag builds
        if: runner.os == 'macOS' && needs.release-contract.outputs.publish == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/cutokyo-signing.p12"
          keychain="$RUNNER_TEMP/cutokyo-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          rm -f "$certificate"
      - name: Import Windows Authenticode certificate for tag builds
        id: windows-cert
        if: runner.os == 'Windows' && needs.release-contract.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'cutokyo-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path -Force
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build unsigned dry-run Tauri package without source rewrites
        if: needs.release-contract.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # reviewed runner/build implementation
        with:
          projectPath: .
          # This pinned runner splits tauriScript on spaces. Keep its argv relative,
          # with evidence outside the checkout, so Windows paths need no shell parsing.
          tauriScript: python tools/scripts/source-snapshot.py --root . --manifest ../tauri-dry-run-source.json -- pnpm exec tauri
          args: --ci --target "${{ matrix.target }}" --features desktop-runtime
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: false
          retryAttempts: 0
      - name: Prepare macOS or Linux public updater configuration
        if: runner.os != 'Windows' && needs.release-contract.outputs.publish == 'true'
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: python tools/release/prepare-signing-config.py --repository "${{ github.repository }}" --output "${{ runner.temp }}/tauri.release.json"
      - name: Build signed macOS or Linux updater package without source rewrites
        if: runner.os != 'Windows' && needs.release-contract.outputs.publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "${{ runner.temp }}/tauri-signed-source.json" -- pnpm exec tauri build --ci --target "${{ matrix.target }}" --features desktop-runtime --bundles "${{ matrix.release-bundles }}" --config "${{ runner.temp }}/tauri.release.json"
      - name: Prepare signed Windows updater configuration
        if: runner.os == 'Windows' && needs.release-contract.outputs.publish == 'true'
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          CUTOKYO_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows-cert.outputs.thumbprint }}
        run: python tools/release/prepare-signing-config.py --windows --repository "${{ github.repository }}" --output "${{ runner.temp }}/tauri.windows.release.json"
      - name: Build signed Windows updater package without source rewrites
        if: runner.os == 'Windows' && needs.release-contract.outputs.publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "${{ runner.temp }}/tauri-signed-source.json" -- pnpm exec tauri build --ci --target "${{ matrix.target }}" --features desktop-runtime --bundles "${{ matrix.release-bundles }}" --config "${{ runner.temp }}/tauri.windows.release.json"
      - name: Remove temporary Apple signing material
        if: ${{ always() && runner.os == 'macOS' && needs.release-contract.outputs.publish == 'true' }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/cutokyo-signing.p12"
          keychain="$RUNNER_TEMP/cutokyo-signing.keychain-db"
          if [[ -e "$keychain" ]]; then security delete-keychain "$keychain"; fi
      - name: Remove temporary Windows signing material
        if: ${{ always() && runner.os == 'Windows' && needs.release-contract.outputs.publish == 'true' }}
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'cutokyo-signing.pfx') -Force -ErrorAction SilentlyContinue
          $thumbprint = '${{ steps.windows-cert.outputs.thumbprint }}'
          if ($thumbprint) { Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction Stop }
      - name: Collect packages and require updater signatures on tags
        shell: bash
        run: |
          mkdir -p tauri-artifacts
          while IFS= read -r -d '' artifact; do
            cp "$artifact" tauri-artifacts/
          done < <(find "$CARGO_TARGET_DIR" -type f -path '*/bundle/*' \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
            -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o \
            -name '*.app.tar.gz' -o -name '*.sig' \
          \) -print0)
          test -n "$(find tauri-artifacts -type f -print -quit)"
          if [[ '${{ needs.release-contract.outputs.publish }}' == 'true' ]]; then
            test -n "$(find tauri-artifacts -type f -name '*.sig' -print -quit)"
          fi
      - name: Install, probe, and uninstall the Linux desktop package before activation
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "${{ runner.temp }}/tauri-smoke-source.json" -- python tools/release/smoke-tauri-linux.py --artifacts tauri-artifacts --expected-version "${{ needs.release-contract.outputs.tag }}" > tauri-artifacts/package-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-${{ matrix.updater-platform }}
          path: tauri-artifacts
          if-no-files-found: error

  release-manifest:
    name: Checksums, updater manifest, and build provenance
    needs: [release-contract, cli-artifacts, global-installers, tauri-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
      - name: Install the Linux network-namespace boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Install and launch the locally packed npm artifact
        run: |
          npm_package="$(find release-artifacts -type f -name 'cutokyo-*.tgz' -print -quit)"
          dependency_package="$(find release-artifacts -type f -name 'detect-libc-2.1.2.tgz' -print -quit)"
          native_archive="$(find release-artifacts -type f -name '*x86_64-unknown-linux-gnu.tar.xz' -print -quit)"
          native_checksum="$(find release-artifacts -type f -name '*x86_64-unknown-linux-gnu.tar.xz.sha256' -print -quit)"
          test -n "$npm_package" && test -n "$dependency_package"
          test -n "$native_archive" && test -n "$native_checksum"
          python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/npm-smoke-source.json" -- python3 tools/release/smoke-npm.py --npm-package "$npm_package" --native-archive "$native_archive" --native-checksum "$native_checksum" --dependency-package "$dependency_package" --expected-version "${{ needs.release-contract.outputs.tag }}" > release-artifacts/npm-smoke.json
          rm -f "$dependency_package"
      - name: Create meaningful local in-toto artifact inventory
        run: |
          python3 tools/scripts/source-snapshot.py \
            --root "${{ github.workspace }}" \
            --manifest "$RUNNER_TEMP/provenance-source.json" \
            -- python3 tools/release/create-provenance.py \
              --artifacts release-artifacts \
              --output release-artifacts/release-contract/release-build.intoto.jsonl \
              --repository "${{ github.repository }}" \
              --revision "${{ github.sha }}" \
              --tag "${{ needs.release-contract.outputs.tag }}" \
              --workflow-ref "${{ github.workflow_ref }}" \
              --invocation-id "${{ github.run_id }}/${{ github.run_attempt }}"
      - name: Build updater signature verifier without source rewrites
        if: needs.release-contract.outputs.publish == 'true'
        run: python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/updater-verifier-source.json" -- cargo build --locked -p cutokyo-updater-signature-verifier --target-dir "$RUNNER_TEMP/updater-verifier-target"
      - name: Build and independently verify deterministic release manifests
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          (
            cd release-artifacts
            find . -type f ! -name SHA256SUMS ! -name release-manifest.json ! -name latest.json -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          manifest_args=(
            --artifacts release-artifacts
            --tag "${{ needs.release-contract.outputs.tag }}"
            --repository "${{ github.repository }}"
            --output release-artifacts/release-manifest.json
          )
          if [[ '${{ needs.release-contract.outputs.publish }}' == 'true' ]]; then
            umask 077
            public_key="$RUNNER_TEMP/tauri-updater-public-key.txt"
            printf '%s' "$TAURI_UPDATER_PUBLIC_KEY" > "$public_key"
            find_one() {
              local root="$1" pattern="$2" label="$3"
              mapfile -d '' matches < <(find "$root" -type f -name "$pattern" -print0)
              if (( ${#matches[@]} != 1 )); then
                printf 'Release refused: expected exactly one %s updater payload, found %s.\n' "$label" "${#matches[@]}" >&2
                exit 78
              fi
              printf '%s' "${matches[0]#release-artifacts/}"
            }
            linux_payload="$(find_one release-artifacts/tauri-linux-x86_64 '*.AppImage' Linux)"
            darwin_payload="$(find_one release-artifacts/tauri-darwin-aarch64 '*.app.tar.gz' macOS)"
            windows_payload="$(find_one release-artifacts/tauri-windows-x86_64 '*.msi' Windows)"
            manifest_args+=(
              --require-updater-signatures
              --signature-verifier "$RUNNER_TEMP/updater-verifier-target/debug/cutokyo-updater-signature-verifier"
              --updater-public-key "$public_key"
              --updater-target "linux-x86_64=$linux_payload"
              --updater-target "darwin-aarch64=$darwin_payload"
              --updater-target "windows-x86_64=$windows_payload"
            )
          fi
          python3 tools/release/create-manifest.py "${manifest_args[@]}"
          python3 tools/release/create-manifest.py "${manifest_args[@]}" --verify-only
      - name: Attest dry-run or release artifacts with GitHub build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release-artifacts/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-release-manifest
          path: release-artifacts
          if-no-files-found: error
      - name: Publish npm and GitHub release only for an authorized tag
        if: needs.release-contract.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm_package="$(find release-artifacts -type f -name '*.tgz' -print -quit)"
          test -n "$npm_package"
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          gh release create "${{ needs.release-contract.outputs.tag }}" "${files[@]}" \
            --verify-tag --generate-notes --draft
          python3 tools/scripts/source-snapshot.py --root "${{ github.workspace }}" --manifest "$RUNNER_TEMP/npm-publish-source.json" -- npm publish "$npm_package" --access public --provenance
          gh release edit "${{ needs.release-contract.outputs.tag }}" --draft=false
