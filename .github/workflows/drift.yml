name: Installed harness drift probe

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
      - name: Install genuine public harness CLIs
        run: npm install --global @anthropic-ai/claude-code @openai/codex opencode-ai
      - name: Record installed Claude Code, Codex, and OpenCode versions
        id: probe
        continue-on-error: true
        run: |
          mkdir -p drift-output
          claude --version > drift-output/claude.txt
          codex --version > drift-output/codex.txt
          opencode --version > drift-output/opencode.txt
          cargo test -p fake-harness
      - name: Preserve drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-harness-drift
          path: drift-output
      - name: Open a non-gating issue when the scheduled probe fails
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Scheduled installed-harness drift probe failed" --body "The non-gating installed Claude Code, Codex, or OpenCode drift probe failed. Inspect the workflow artifact before changing adapters."
