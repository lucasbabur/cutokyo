pre-commit:
  parallel: true
  commands:
    rust-format-changed:
      glob: "*.rs"
      run: rustfmt --check --edition 2024 {staged_files}
    prettier-changed:
      glob: "*.{json,md,yaml,yml,ts,tsx,mjs}"
      run: ui/node_modules/.bin/prettier --check {staged_files}
    static-contract-changed:
      glob: "{Cargo.toml,crates/**,schemas/**,fixtures/**,docs/**,.github/**,tools/fleet/**}"
      run: python3 tools/fleet/cutokyo-gates.py all --root .

commit-msg:
  commands:
    dco-reminder:
      run: python3 tools/scripts/check-commit-message.py {1}
